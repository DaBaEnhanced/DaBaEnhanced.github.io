---
layout: default
---

<style>
  .poem-hero {
    aspect-ratio: 21 / 9;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
  }

  .poem-hero video,
  .poem-hero img {
    display: block;
    height: 100%;
    object-fit: cover;
    object-position: center;
    width: 100%;
  }

  .poem-hero::after {
    background: linear-gradient(180deg, rgba(5, 6, 10, 0) 45%, rgba(5, 6, 10, 0.92) 100%);
    content: "";
    inset: 0;
    position: absolute;
  }

  .poem-hero-title {
    bottom: 0;
    color: #ffffff;
    font-family: "Space Grotesk", sans-serif;
    font-size: clamp(1.3rem, 3vw, 2rem);
    font-weight: 600;
    left: 0;
    margin: 0;
    padding: 1rem clamp(1rem, 4vw, 2rem);
    position: absolute;
    right: 0;
  }

  .poem-frame {
    position: relative;
    z-index: 0;
  }

  .poem-corner {
    height: auto;
    opacity: 0.8;
    position: absolute;
    width: 70px;
    z-index: -1;
  }

  .poem-corner-top {
    left: 0;
    top: 0;
    transform: rotate(180deg);
  }

  .poem-corner-bottom {
    bottom: 0;
    right: 0;
  }

  .poem-content {
    margin: 0 auto;
    max-width: 700px;
    padding: 2rem 1rem;
  }

  .poem-content h1 {
    color: var(--vault-heading, #f5f7fb);
    font-size: 1.5rem;
    margin: 2rem 0 1rem;
  }

  .poem-content h1:first-child {
    margin-top: 0;
  }
</style>

<div class="poem-hero">
  {% if page.thumbnail contains '.mp4' or page.thumbnail contains '.webm' %}
    <video src="{{ site.cdn_url }}{{ page.thumbnail }}" autoplay loop muted playsinline></video>
  {% else %}
    <img src="{{ site.cdn_url }}{{ page.thumbnail }}" alt="{{ page.summary }}" />
  {% endif %}
  <h1 class="poem-hero-title">{{ page.title }}</h1>
</div>

<div class="poem-frame">
  <img class="poem-corner poem-corner-top" src="{{ site.cdn_url }}/images/corner-dark.png" alt="" aria-hidden="true" />
  <img class="poem-corner poem-corner-bottom" src="{{ site.cdn_url }}/images/corner-dark.png" alt="" aria-hidden="true" />
  <div class="poem-content">
    {{ content }}
  </div>
</div>
