---
layout: default
---

<style>
  .video-hero {
    aspect-ratio: 21 / 9;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
  }

  .video-hero img {
    display: block;
    height: 100%;
    object-fit: cover;
    object-position: center;
    width: 100%;
  }

  .video-hero::after {
    background: linear-gradient(180deg, rgba(5, 6, 10, 0) 45%, rgba(5, 6, 10, 0.92) 100%);
    content: "";
    inset: 0;
    position: absolute;
  }

  .video-hero-title {
    bottom: 0;
    color: #ffffff;
    font-family: "Space Grotesk", sans-serif;
    font-size: clamp(1.3rem, 3vw, 2rem);
    font-weight: 600;
    left: 0;
    margin: 0;
    padding: 1rem clamp(1rem, 4vw, 2rem);
    position: absolute;
    right: 0;
  }

  .video-content {
    margin: 0 auto;
    max-width: 800px;
    padding: 2rem 1rem;
  }

  .video-caption {
    color: var(--vault-text-muted, #93a0b4);
    font-size: 1.1em;
    margin-top: 1rem;
    text-align: center;
  }
</style>

<div class="video-hero">
  <img src="{{ site.cdn_url }}{{ page.thumbnail }}" alt="{{ page.summary }}" />
  <h1 class="video-hero-title">{{ page.title }}</h1>
</div>

<div class="video-content">
  {{ content }}
</div>
