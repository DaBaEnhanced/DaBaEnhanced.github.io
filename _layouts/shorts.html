---
layout: default
---

<style>
  .short-hero {
    aspect-ratio: 21 / 9;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
  }

  .short-hero video,
  .short-hero img {
    display: block;
    height: 100%;
    object-fit: cover;
    object-position: center;
    width: 100%;
  }

  .short-hero::after {
    background: linear-gradient(180deg, rgba(5, 6, 10, 0) 45%, rgba(5, 6, 10, 0.92) 100%);
    content: "";
    inset: 0;
    position: absolute;
  }

  .short-hero-title {
    bottom: 0;
    color: #ffffff;
    font-family: "Space Grotesk", sans-serif;
    font-size: clamp(1.3rem, 3vw, 2rem);
    font-weight: 600;
    left: 0;
    margin: 0;
    padding: 1rem clamp(1rem, 4vw, 2rem);
    position: absolute;
    right: 0;
  }

  .short-content {
    margin: 0 auto;
    max-width: 700px;
    padding: 2rem 1rem;
  }

  #dbxaudio {
    background: var(--vault-panel, #151923);
    border: 1px solid var(--vault-border, rgba(255, 255, 255, 0.08));
    border-radius: 10px;
    height: auto !important;
    padding: 0.85rem 1rem;
  }

  #dbxaudio span {
    color: var(--vault-text-muted, #93a0b4);
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
  }
</style>

<div class="short-hero">
  {% if page.thumbnail contains '.mp4' or page.thumbnail contains '.webm' %}
    <video src="{{ site.cdn_url }}{{ page.thumbnail }}" autoplay loop muted playsinline></video>
  {% else %}
    <img src="{{ site.cdn_url }}{{ page.thumbnail }}" alt="{{ page.summary }}" />
  {% endif %}
  <h1 class="short-hero-title">{{ page.title }}</h1>
</div>

<div class="short-content">
  {{ content }}
</div>
