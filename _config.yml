# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: D. B. Waldtier's Vault
author: D. B. Waldtier
subtitle: >- # this means to ignore newlines until "baseurl:"
  A collection of random stuff I wrote, and some AI-generated content.
#email: dabaenhanced@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Books, poems, games and old AI videos.
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com

# Base for every asset (image/video/audio/zip/pdf/game bundle) referenced
# across the site. Locally this stays "/assets" (served from this repo's
# own assets/ folder). Once assets are uploaded to R2, flip this to the
# CDN's base, e.g. "https://assets.waldtier.com" (which is already the
# same domain the PDF links use) -- every reference site-wide repoints
# in one edit, no other file needs to change.
cdn_url: "https://assets.waldtier.com"
instagram_username: clumsy.giba
github_username: dabaenhanced
youtube_username: "@clumsy_giba"
snapchat_username: clumsygiba
show_excerpts: true
home_post_limit: 5

# Build settings
theme: minima
kramdown:
  math_engine: mathjax
#remote_theme: pages-themes/hacker@v0.2.0
plugins:
  - jekyll-feed
#  - jekyll-remote-theme

collections:
  videos:
    output: true
  shorts:
    output: true
  poetry:
    output: true
future: true

include:
  - _games

header_pages:
  - about.markdown
  - books.markdown
  - games.markdown
  - poems.markdown
  - short.markdown
  - video.markdown
  - physics.markdown

exclude:
  - assets/videos
  - assets/images
  - assets/audio
  - assets/pdf
  - assets/HG
  - assets/saintdragon
  - assets/physic
  - assets/HG.zip
  - assets/saint.zip

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
