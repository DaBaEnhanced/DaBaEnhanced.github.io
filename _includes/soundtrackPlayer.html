<!-- Soundtrack player: a modal music player opened by any element with data-ost="<id>" (see window.OST below).
     Audio streams from the CDN with a plain <audio> element (no CORS needed). Keeps playing when closed:
     a small "now playing" pill reopens it. -->
<style>
	.ost-modal { position: fixed; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center; padding: 16px;
		background: rgba(4, 3, 10, 0.78); backdrop-filter: blur(4px); }
	.ost-modal.open { display: flex; }
	.ost-box { position: relative; width: min(920px, 100%); max-height: calc(100vh - 32px); overflow: hidden; display: grid; grid-template-columns: 300px 1fr;
		background: linear-gradient(180deg, #1a1430 0%, #0d0a18 100%); color: #ddd6ea; border: 1px solid #ff4fa3; border-radius: 12px;
		box-shadow: 0 0 0 1px #000, 0 0 40px rgba(255, 79, 163, 0.35); font-family: inherit; }
	.ost-box::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: 12px;
		background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.12) 0 1px, transparent 1px 3px); }
	.ost-side { padding: 20px; border-right: 1px solid rgba(255, 79, 163, 0.25); display: flex; flex-direction: column; gap: 14px; }
	.ost-cover { width: 100%; aspect-ratio: 1; border-radius: 6px; display: block; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6); }
	.ost-now { min-height: 3.2em; }
	.ost-now b { display: block; color: #fff; font-size: 1.05rem; line-height: 1.25; }
	.ost-now span { color: #ff7cc0; font-size: 0.85rem; }
	.ost-seek { display: flex; align-items: center; gap: 8px; font: 0.78rem ui-monospace, Menlo, Consolas, monospace; color: #ffb547; }
	.ost-seek input { flex: 1; }
	.ost-ctl { display: flex; align-items: center; justify-content: center; gap: 10px; }
	.ost-ctl button, .ost-x { cursor: pointer; border: 1px solid rgba(255, 79, 163, 0.7); background: rgba(255, 79, 163, 0.08); color: #ffe8f4;
		border-radius: 50%; width: 42px; height: 42px; font-size: 16px; line-height: 1; display: inline-flex; align-items: center; justify-content: center;
		box-shadow: 0 0 10px rgba(255, 79, 163, 0.25); }
	.ost-ctl button:hover, .ost-x:hover { background: rgba(255, 79, 163, 0.3); }
	.ost-ctl .ost-play { width: 56px; height: 56px; font-size: 22px; background: rgba(255, 79, 163, 0.35); }
	.ost-vol { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: #9a91b3; }
	.ost-vol input { flex: 1; }
	.ost-modal input[type=range] { accent-color: #ff4fa3; }
	.ost-dl { display: block; text-align: center; padding: 9px 10px; border-radius: 6px; background: #ff4fa3; color: #fff !important; font-weight: 700;
		text-decoration: none !important; box-shadow: 0 4px 14px rgba(255, 79, 163, 0.35); }
	.ost-dl:hover { background: #ff6fb6; }
	.ost-main { display: flex; flex-direction: column; min-height: 0; }
	.ost-head { padding: 18px 64px 10px 20px; }
	.ost-head h3 { margin: 0; color: #fff; letter-spacing: 0.08em; font-size: 1.1rem; text-transform: uppercase; }
	.ost-head p { margin: 4px 0 0; color: #9a91b3; font-size: 0.85rem; }
	.ost-list { list-style: none; margin: 0; padding: 0 10px 14px; overflow-y: auto; flex: 1; min-height: 0; }
	.ost-list li { display: grid; grid-template-columns: 2.2em 1fr auto; gap: 8px; align-items: baseline; padding: 8px 10px; border-radius: 6px; cursor: pointer;
		border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
	.ost-list li:hover { background: rgba(95, 227, 255, 0.07); }
	.ost-list li.cur { background: rgba(255, 79, 163, 0.16); }
	.ost-list .n { color: #ff4fa3; font: 0.8rem ui-monospace, Menlo, Consolas, monospace; }
	.ost-list .t { color: #fff; }
	.ost-list .t small { display: block; color: #9a91b3; font-size: 0.78rem; }
	.ost-list .d { color: #ffb547; font: 0.8rem ui-monospace, Menlo, Consolas, monospace; }
	.ost-list li.cur .n::before { content: "▶"; }
	.ost-list li.cur .n span { display: none; }
	.ost-x { position: absolute; top: 12px; right: 12px; z-index: 2; width: 36px; height: 36px; }
	.ost-pill { position: fixed; right: 16px; bottom: 16px; z-index: 999; display: none; gap: 8px; align-items: center; padding: 8px 14px; border-radius: 999px;
		background: #1a1430; color: #ffe8f4; border: 1px solid #ff4fa3; box-shadow: 0 0 18px rgba(255, 79, 163, 0.35); cursor: pointer; font-size: 0.85rem; max-width: calc(100vw - 32px); }
	.ost-pill.show { display: inline-flex; }
	.ost-pill b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	/* per-album themes (data-theme on the modal and the pill) */
	.ost-modal[data-theme="vertebra"] { background: rgba(6, 2, 3, 0.82); }
	.ost-modal[data-theme="vertebra"] .ost-box { background: radial-gradient(ellipse at 30% 0%, #2a1512 0%, #120a0a 55%, #0b0608 100%); color: #e6d8bc;
		border: 2px solid #8a6a3a; border-radius: 4px; box-shadow: 0 0 0 1px #000, inset 0 0 0 1px rgba(242, 198, 109, 0.18), 0 0 46px rgba(199, 54, 28, 0.38); }
	.ost-modal[data-theme="vertebra"] .ost-box::after { border-radius: 4px; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.14) 0 1px, transparent 1px 3px); }
	.ost-modal[data-theme="vertebra"] .ost-side { border-right-color: rgba(242, 198, 109, 0.22); }
	.ost-modal[data-theme="vertebra"] .ost-cover { border-radius: 2px; border: 1px solid rgba(242, 198, 109, 0.35); }
	.ost-modal[data-theme="vertebra"] .ost-now span, .ost-modal[data-theme="vertebra"] .ost-head p, .ost-modal[data-theme="vertebra"] .ost-list .t small, .ost-modal[data-theme="vertebra"] .ost-vol { color: #a8957a; }
	.ost-modal[data-theme="vertebra"] .ost-head h3 { color: #f2c66d; text-shadow: 0 2px 0 #3a1408; }
	.ost-modal[data-theme="vertebra"] .ost-seek, .ost-modal[data-theme="vertebra"] .ost-list .d { color: #ff8a3a; }
	.ost-modal[data-theme="vertebra"] .ost-ctl button, .ost-modal[data-theme="vertebra"] .ost-x { border-color: rgba(242, 198, 109, 0.6); background: rgba(199, 54, 28, 0.1); color: #f2e6cc; }
	.ost-modal[data-theme="vertebra"] .ost-ctl button:hover, .ost-modal[data-theme="vertebra"] .ost-x:hover { background: rgba(199, 54, 28, 0.35); }
	.ost-modal[data-theme="vertebra"] .ost-ctl .ost-play { background: radial-gradient(circle at 40% 30%, #d65228, #7a1e10); border-color: #ff8a3a; }
	.ost-modal[data-theme="vertebra"] input[type=range] { accent-color: #ff8a3a; }
	.ost-modal[data-theme="vertebra"] .ost-dl { background: #c7361c; border-radius: 3px; }
	.ost-modal[data-theme="vertebra"] .ost-dl:hover { background: #e04a26; }
	.ost-modal[data-theme="vertebra"] .ost-list li { border-radius: 3px; }
	.ost-modal[data-theme="vertebra"] .ost-list li:hover { background: rgba(242, 198, 109, 0.07); }
	.ost-modal[data-theme="vertebra"] .ost-list li.cur { background: rgba(199, 54, 28, 0.22); }
	.ost-modal[data-theme="vertebra"] .ost-list .n { color: #ff8a3a; }
	.ost-modal[data-theme="vertebra"] .ost-list .t { color: #f2e6cc; }
	.ost-pill[data-theme="vertebra"] { background: #1a0f10; color: #f2e6cc; border-color: #c7361c; box-shadow: 0 0 18px rgba(199, 54, 28, 0.4); }
	@media (max-width: 699px) {
		.ost-box { grid-template-columns: 1fr; overflow-y: auto; }
		.ost-side { border-right: 0; border-bottom: 1px solid rgba(255, 79, 163, 0.25); }
		.ost-cover { width: 60%; margin: 0 auto; }
		.ost-list { overflow: visible; }
	}
</style>

<div class="ost-modal" id="ost-modal" role="dialog" aria-modal="true" aria-labelledby="ost-title">
	<div class="ost-box">
		<button class="ost-x" type="button" aria-label="Close" data-ost-close>✕</button>
		<div class="ost-side">
			<img class="ost-cover" id="ost-cover" alt="">
			<div class="ost-now" id="ost-now"></div>
			<div class="ost-seek"><span id="ost-cur">0:00</span><input type="range" id="ost-seek" min="0" max="1000" value="0" aria-label="Seek"><span id="ost-dur">0:00</span></div>
			<div class="ost-ctl">
				<button type="button" id="ost-prev" aria-label="Previous track">⏮</button>
				<button type="button" id="ost-play" class="ost-play" aria-label="Play">▶</button>
				<button type="button" id="ost-next" aria-label="Next track">⏭</button>
			</div>
			<div class="ost-vol"><span>VOL</span><input type="range" id="ost-vol" min="0" max="100" value="85" aria-label="Volume"></div>
			<a class="ost-dl" id="ost-dl" href="#" download>&#8681; Download the soundtrack (110 MB)</a>
		</div>
		<div class="ost-main">
			<div class="ost-head"><h3 id="ost-title"></h3><p id="ost-sub"></p></div>
			<ol class="ost-list" id="ost-list"></ol>
		</div>
	</div>
</div>
<button class="ost-pill" id="ost-pill" type="button"><span>♫</span><b id="ost-pill-t"></b></button>
<audio id="ost-audio" preload="none"></audio>

<script>
window.OST = Object.assign(window.OST || {}, {
	afterglow: {
		title: "AFTERGLOW · Original Soundtrack",
		sub: "16 tracks · retrowave and late-80s club music from the game",
		base: "{{ site.cdn_url }}/games/afterglow/soundtrack/",
		cover: "cover.jpg",
		zip: "{{ site.cdn_url }}/games/afterglow_soundtrack.zip",
		size: "110 MB",
		artist: "D. B. Waldtier",
		tracks: [
			["Afterglow", "Title theme and end credits", "01-afterglow.mp3", 182],
			["Wet Asphalt", "Chapter 1 stages", "02-wet-asphalt.mp3", 169],
			["Courier", "Chapter 1, on the radio", "03-courier.mp3", 164],
			["Route One Gold", "Chapter 2 stages", "04-route-one-gold.mp3", 169],
			["Voice in the Dashboard", "Chapter 2, Lyra's song", "05-voice-in-the-dashboard.mp3", 122],
			["Dish Country", "Chapter 3 stages", "06-dish-country.mp3", 168],
			["The Listeners", "Chapter 3 boss", "07-the-listeners.mp3", 121],
			["Avalanche Gallery", "Chapter 4 stages", "08-avalanche-gallery.mp3", 188],
			["White Line", "Chapter 4, the duel with Kaede", "09-white-line.mp3", 175],
			["High Water", "Chapter 5 stages", "10-high-water.mp3", 168],
			["Always Come Back", "Love theme", "11-always-come-back.mp3", 149],
			["Smokestacks", "Chapter 6 stages", "12-smokestacks.mp3", 169],
			["Paper Girl", "Chapter 6 reveal", "13-paper-girl.mp3", 160],
			["Mama Dolores' Garage", "Garage and menus", "14-mama-dolores-garage.mp3", 150],
			["Signal to Everything", "Chapter 7 finale", "15-signal-to-everything.mp3", 152],
			["Sunrise Over the Tower", "Ending", "16-sunrise-over-the-tower.mp3", 148]
		]
	},
	vertebra: {
		title: "VERTEBRA · Original Soundtrack",
		sub: "22 tracks · the music of the bone serpent's flight across the Empire",
		base: "{{ site.cdn_url }}/games/vertebra/soundtrack/",
		cover: "cover.jpg",
		zip: "{{ site.cdn_url }}/games/vertebra_soundtrack.zip",
		size: "115 MB",
		artist: "D. B. Waldtier",
		tracks: [
			["Vertebra", "Main title", "01-vertebra.mp3", 220],
			["Bones Remember", "The road: map, shrines, forge and market", "02-bones-remember.mp3", 173],
			["The Foundry Coast", "Region I", "03-the-foundry-coast.mp3", 233],
			["Furnace Hounds", "Region I, elite", "04-furnace-hounds.mp3", 233],
			["The Drydock", "Region I, boss", "05-the-drydock.mp3", 173],
			["The Spire Gardens", "Region II", "06-the-spire-gardens.mp3", 233],
			["Thorns Under Glass", "Region II, elite", "07-thorns-under-glass.mp3", 233],
			["The Gardener", "Region II, boss", "08-the-gardener.mp3", 173],
			["The Storm Engines", "Region III", "09-the-storm-engines.mp3", 233],
			["Lightning Rod", "Region III, elite", "10-lightning-rod.mp3", 233],
			["The Conductor", "Region III, boss", "11-the-conductor.mp3", 173],
			["The Ossuary Mines", "Region IV", "12-the-ossuary-mines.mp3", 233],
			["Deep Seam", "Region IV, elite", "13-deep-seam.mp3", 233],
			["The Bonewright", "Region IV, boss", "14-the-bonewright.mp3", 173],
			["The Imperial Ring", "Region V", "15-the-imperial-ring.mp3", 233],
			["Crown Guard", "Region V, elite", "16-crown-guard.mp3", 233],
			["The Engineer-Queen", "Region V, boss", "17-the-engineer-queen.mp3", 173],
			["The Heart of the Serpent", "The secret region", "18-the-heart-of-the-serpent.mp3", 233],
			["The First Head", "Final boss", "19-the-first-head.mp3", 173],
			["Ashes of the Empire", "Ending", "20-ashes-of-the-empire.mp3", 75],
			["The Ossuary", "Unlocks, codex and records", "21-the-ossuary.mp3", 169],
			["Arcade Gauntlet", "Gauntlet mode", "22-arcade-gauntlet.mp3", 233]
		]
	}
});

(function () {
	var $ = function (id) { return document.getElementById(id); };
	var modal = $("ost-modal"), audio = $("ost-audio"), list = $("ost-list"), seek = $("ost-seek"), playBtn = $("ost-play"), pill = $("ost-pill");
	var album = null, idx = -1, seeking = false;
	var fmt = function (s) { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2); };
	try { var v = localStorage.getItem("ost-vol"); if (v !== null) $("ost-vol").value = v; } catch (e) {}
	audio.volume = $("ost-vol").value / 100;

	function open(id) {
		var a = window.OST[id]; if (!a) return;
		if (album !== a) {
			album = a; idx = -1; modal.setAttribute("data-theme", id); pill.setAttribute("data-theme", id);
			$("ost-title").textContent = a.title; $("ost-sub").textContent = a.sub || "";
			$("ost-cover").src = a.base + a.cover; $("ost-cover").alt = a.title + " cover";
			$("ost-dl").href = a.zip; $("ost-dl").innerHTML = "&#8681; Download the soundtrack" + (a.size ? " (" + a.size + ")" : "");
			list.innerHTML = "";
			a.tracks.forEach(function (t, i) {
				var li = document.createElement("li");
				li.innerHTML = '<span class="n"><span>' + ("0" + (i + 1)).slice(-2) + '</span></span><span class="t"></span><span class="d">' + fmt(t[3]) + "</span>";
				li.querySelector(".t").textContent = t[0];
				var sm = document.createElement("small"); sm.textContent = t[1]; li.querySelector(".t").appendChild(sm);
				li.addEventListener("click", function () { play(i); });
				list.appendChild(li);
			});
			select(0, false);
		}
		modal.classList.add("open"); pill.classList.remove("show");
		document.documentElement.style.overflow = "hidden";
		playBtn.focus({ preventScroll: true });
	}
	function close() {
		modal.classList.remove("open"); document.documentElement.style.overflow = "";
		if (!audio.paused) pill.classList.add("show");
	}
	function select(i, autoplay) {
		if (!album) return;
		i = (i + album.tracks.length) % album.tracks.length;
		idx = i; var t = album.tracks[i];
		audio.src = album.base + t[2];
		[].forEach.call(list.children, function (li, j) { li.classList.toggle("cur", j === i); });
		$("ost-now").innerHTML = "<b></b><span></span>";
		$("ost-now").firstChild.textContent = t[0]; $("ost-now").lastChild.textContent = t[1];
		$("ost-pill-t").textContent = t[0];
		$("ost-dur").textContent = fmt(t[3]); $("ost-cur").textContent = "0:00"; seek.value = 0;
		if ("mediaSession" in navigator) {
			try { navigator.mediaSession.metadata = new MediaMetadata({ title: t[0], artist: album.artist, album: album.title, artwork: [{ src: album.base + album.cover, sizes: "1400x1400", type: "image/jpeg" }] }); } catch (e) {}
		}
		if (autoplay) audio.play().catch(function () {});
	}
	function play(i) { select(i, true); }
	function toggle() { if (idx < 0) return play(0); if (audio.paused) audio.play().catch(function () {}); else audio.pause(); }

	document.addEventListener("click", function (e) {
		var b = e.target.closest && e.target.closest("[data-ost]");
		if (b) { e.preventDefault(); open(b.getAttribute("data-ost")); return; }
		if (e.target === modal || (e.target.closest && e.target.closest("[data-ost-close]"))) close();
	});
	pill.addEventListener("click", function () { modal.classList.add("open"); pill.classList.remove("show"); document.documentElement.style.overflow = "hidden"; });
	document.addEventListener("keydown", function (e) {
		if (!modal.classList.contains("open")) return;
		if (e.key === "Escape") close();
		else if (e.key === " " && e.target.tagName !== "INPUT") { e.preventDefault(); toggle(); }
		else if (e.key === "ArrowRight" && e.target.tagName !== "INPUT") play(idx + 1);
		else if (e.key === "ArrowLeft" && e.target.tagName !== "INPUT") play(idx - 1);
	});
	playBtn.addEventListener("click", toggle);
	$("ost-prev").addEventListener("click", function () { if (audio.currentTime > 3) audio.currentTime = 0; else play(idx - 1); });
	$("ost-next").addEventListener("click", function () { play(idx + 1); });
	$("ost-vol").addEventListener("input", function () { audio.volume = this.value / 100; try { localStorage.setItem("ost-vol", this.value); } catch (e) {} });
	seek.addEventListener("input", function () { seeking = true; if (audio.duration) $("ost-cur").textContent = fmt(audio.duration * seek.value / 1000); });
	seek.addEventListener("change", function () { if (audio.duration) audio.currentTime = audio.duration * seek.value / 1000; seeking = false; });
	audio.addEventListener("timeupdate", function () {
		if (!audio.duration) return;
		$("ost-cur").textContent = fmt(audio.currentTime); $("ost-dur").textContent = fmt(audio.duration);
		if (!seeking) seek.value = Math.round(audio.currentTime / audio.duration * 1000);
	});
	audio.addEventListener("play", function () { playBtn.textContent = "❚❚"; playBtn.setAttribute("aria-label", "Pause"); });
	audio.addEventListener("pause", function () { playBtn.textContent = "▶"; playBtn.setAttribute("aria-label", "Play"); if (!modal.classList.contains("open")) pill.classList.remove("show"); });
	audio.addEventListener("ended", function () { if (idx < album.tracks.length - 1) play(idx + 1); });
	if ("mediaSession" in navigator) {
		try {
			navigator.mediaSession.setActionHandler("play", function () { audio.play(); });
			navigator.mediaSession.setActionHandler("pause", function () { audio.pause(); });
			navigator.mediaSession.setActionHandler("previoustrack", function () { play(idx - 1); });
			navigator.mediaSession.setActionHandler("nexttrack", function () { play(idx + 1); });
		} catch (e) {}
	}
})();
</script>
