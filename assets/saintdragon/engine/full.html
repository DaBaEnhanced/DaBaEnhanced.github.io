<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saint Dragon</title>
<style>
  :root { color-scheme: dark; --ink:#f0ead8; --gold:#d5a94f; --red:#b83338; --panel:#111317; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; overflow:hidden; background:#090a0d;
         color:var(--ink); font-family:"Courier New", monospace; }
  main { min-height:100vh; display:grid; grid-template-rows:auto 1fr; }
  .bar { min-height:44px; padding:6px 12px; display:flex; align-items:center; gap:8px;
         background:var(--panel); border-bottom:1px solid #343840; }
  .brand { margin-right:auto; color:var(--gold); font-weight:700; letter-spacing:0; }
  button, .toggle { min-height:30px; border:1px solid #555b65; border-radius:4px; background:#20242a;
                    color:var(--ink); font:700 12px/1 "Courier New", monospace; }
  button { padding:0 11px; cursor:pointer; }
  button:hover { background:#30353d; border-color:#858c97; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  .toggle { padding:0 9px; display:inline-flex; align-items:center; gap:7px; cursor:pointer; }
  .toggle input { accent-color:var(--gold); }
  .screen { position:relative; min-height:0; display:grid; place-items:center; overflow:hidden;
            background-color:#101217;
            background-image:linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),
                             linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px);
            background-size:24px 24px; }
  .console { position:relative; width:min(100%,calc((100vh - 44px) * 368 / 182)); }
  .frame { position:relative; width:100%; aspect-ratio:368/182;
           max-height:calc(100vh - 44px); background:#000; box-shadow:0 18px 70px #000; }
  iframe { display:block; width:100%; height:100%; border:0; background:#000; }
  .frame.crt iframe { filter:saturate(1.12) contrast(1.05) brightness(.96); }
  .frame.crt::after { content:""; position:absolute; inset:0; z-index:4; pointer-events:none;
                      background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,
                                 rgba(0,0,0,.2) 2px,rgba(0,0,0,.2) 3px);
                      box-shadow:inset 0 0 26px rgba(0,0,0,.72); }
  .touch-controls { display:none; position:absolute; inset:0; z-index:5; pointer-events:none;
                    touch-action:none; user-select:none; }
  .touch-fire, .touch-stick { position:absolute; bottom:max(12px,env(safe-area-inset-bottom));
                              width:clamp(87px,27vw,123px); aspect-ratio:1; border-radius:50%;
                              border:2px solid rgba(240,234,216,.72); background:rgba(17,19,23,.48);
                              box-shadow:inset 0 0 0 5px rgba(0,0,0,.18),0 3px 12px rgba(0,0,0,.45);
                              pointer-events:auto; touch-action:none; }
  .touch-fire { left:max(14px,env(safe-area-inset-left)); }
  .touch-fire::before { content:""; position:absolute; inset:25%; border-radius:50%;
                        background:rgba(184,51,56,.85); box-shadow:0 0 0 3px rgba(255,255,255,.12); }
  .touch-fire.pressed::before { transform:scale(.82); background:#ed4c51; }
  .touch-stick { right:max(14px,env(safe-area-inset-right)); }
  .touch-stick::before, .touch-stick::after { content:""; position:absolute; opacity:.35;
                                               background:var(--ink); pointer-events:none; }
  .touch-stick::before { left:49%; top:12%; bottom:12%; width:2px; }
  .touch-stick::after { top:49%; left:12%; right:12%; height:2px; }
  .touch-knob { position:absolute; left:50%; top:50%; width:46%; aspect-ratio:1; border-radius:50%;
                background:rgba(213,169,79,.9); border:2px solid rgba(255,247,221,.8);
                transform:translate(-50%,-50%); pointer-events:none; }
  .overlay { position:absolute; inset:0; z-index:6; display:grid; place-items:center;
             background:rgba(3,4,6,.92); text-align:center; padding:22px; }
  .overlay[hidden] { display:none; }
  .panel { width:min(390px,90%); }
  h1 { margin:0 0 10px; color:var(--gold); font-size:clamp(25px,6vw,46px); line-height:1; letter-spacing:0; }
  .prompt { margin:0 0 20px; color:#bcc1c9; font-size:13px; }
  .start { min-height:38px; padding:0 18px; border-color:var(--gold); color:#fff7dd; }
  .scores h2 { margin:0 0 18px; color:var(--gold); font-size:24px; }
  .score-row { display:grid; grid-template-columns:32px 1fr 90px; gap:12px; margin:7px auto;
               width:min(300px,100%); text-align:left; color:#d9dde3; }
  .score-row .points { text-align:right; color:#fff0bd; }
  .you { color:#fff; background:var(--red); padding:2px 4px; }
  .status { color:#9198a3; font-size:11px; white-space:nowrap; }
  .fullscreen { display:none; }
  .fullscreen[hidden] { display:none; }
  @media (max-width:620px) {
    main { grid-template-rows:auto 1fr; }
    .bar { min-height:48px; padding:6px 8px; gap:5px; }
    .brand, .status { display:none; }
    button, .toggle { min-height:34px; padding-left:8px; padding-right:8px; }
    .console { width:100%; }
    .frame { max-height:calc(100vh - 48px); }
  }
  @media (hover:none) and (pointer:coarse) {
    .touch-controls.active { display:block; }
    .fullscreen { display:inline-flex; align-items:center; justify-content:center; }
  }
  @media (hover:none) and (pointer:coarse) and (orientation:portrait) {
    .screen { place-items:stretch center; }
    .console { height:100%; display:grid; grid-template-rows:auto 1fr; align-content:start; }
    .frame { box-shadow:0 8px 28px #000; }
    .touch-controls { position:relative; inset:auto; min-height:0;
                      border-top:1px solid rgba(240,234,216,.16);
                      background:linear-gradient(to bottom,rgba(31,34,40,.78),rgba(14,16,20,.42)); }
    .touch-fire, .touch-stick { bottom:50%; transform:translateY(50%);
                                width:clamp(108px,33vw,138px); }
  }
</style>

<main>
  <header class="bar">
    <span class="brand">SAINT DRAGON</span>
    <span class="status" id="status">READY</span>
    <button id="cheat" title="Enable invulnerability and upgrade weapons">CHEAT</button>
    <button id="audio" title="Turn game audio off">AUDIO: ON</button>
    <label class="toggle" title="Original pixel-accurate art, or the 4x AI-upscaled enhanced set"><input id="hd" type="checkbox"> HD</label>
    <label class="toggle" title="Toggle scanlines and phosphor treatment"><input id="crt" type="checkbox" checked> CRT</label>
    <button class="fullscreen" id="fullscreen" title="Enter fullscreen" aria-label="Enter fullscreen">FULL</button>
  </header>
  <section class="screen">
    <div class="console">
      <div class="frame crt" id="frame">
        <iframe id="game" title="Saint Dragon game" allow="autoplay"></iframe>
        <div class="overlay" id="start-screen">
          <div class="panel">
            <h1>SAINT DRAGON</h1>
            <p class="prompt">ONE PLAYER</p>
            <button class="start" id="start">START GAME</button>
          </div>
        </div>
        <div class="overlay scores" id="scores" hidden>
          <div class="panel">
            <h2>HIGH SCORES</h2>
            <div id="score-list"></div>
            <p class="prompt" id="score-prompt">400</p>
            <button class="start" id="again">PLAY AGAIN</button>
          </div>
        </div>
      </div>
      <div class="touch-controls" id="touch-controls" aria-hidden="true">
        <button class="touch-fire" id="touch-fire" aria-label="Fire"></button>
        <div class="touch-stick" id="touch-stick" role="group" aria-label="Movement joystick">
          <span class="touch-knob" id="touch-knob"></span>
        </div>
      </div>
    </div>
  </section>
</main>
<script src="../audio/paula.js?v=2afcfc89b8"></script>
<script src="config.js?v=cbf8ea3912"></script>
<script>
'use strict';
const AUDIO_V = 'b88f9510db70';
const game = document.getElementById('game');
const frame = document.getElementById('frame');
const status = document.getElementById('status');
const startScreen = document.getElementById('start-screen');
const scoresScreen = document.getElementById('scores');
const touchControls = document.getElementById('touch-controls');
const touchFire = document.getElementById('touch-fire');
const touchStick = document.getElementById('touch-stick');
const touchKnob = document.getElementById('touch-knob');
const fullscreen = document.getElementById('fullscreen');
let audioContext = null, audio = null, audioEnabled = true;
let route = 'idle', routeStart = 0, stage = 1, score = 0, lives = 5;
let guns = { spread:0, type:1, level:0 };
let boundWorld = null, routeLoading = false, scoreDeadline = 0, scoreRecorded = false;

// Original vs Enhanced (4x upscaled art + smoothing + interpolation). Persisted,
// and overridable for a one-off via ?edition=hd on the shell URL.
let edition = localStorage.getItem('saint-dragon-edition') ||
  (new URLSearchParams(location.search).get('edition') === 'hd' ? 'hd' : 'original');

function routeUrl(mode, number) {
  const params = new URLSearchParams({ full:'1' });
  if (mode === 'stage') params.set('stage', String(number));
  else params.set('mode', mode);
  if (edition === 'hd') params.set('edition', 'hd');
  // Carry an explicit ?smooth=1 through as well (the HD edition turns it on by
  // default; this lets it be forced on the original from the shell URL too).
  if (new URLSearchParams(location.search).get('smooth') === '1') params.set('smooth', '1');
  return `index.html?${params}`;
}

function loadRoute(next, number) {
  clearTouchInput();
  route = next;
  boundWorld = null;
  routeLoading = true;
  if (number) stage = number;
  status.textContent = next === 'stage' ? `STAGE ${stage}` : next.toUpperCase();
  touchControls.classList.toggle('active', next === 'stage');
  game.src = routeUrl(next, stage);
}

async function startAudio() {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const cfg = await SaintDragonAssets.load();
    audio = await SaintDragonAudio.load(audioContext, cfg.audio, cfg.version || AUDIO_V,
                                        { fetch: SaintDragonAssets.fetchRetry });
    audio.musicVolume = .8;
    audio.sfxVolume = .8;
  }
  if (audioEnabled) await audioContext.resume();
}

function bindWorld(world) {
  boundWorld = world;
  routeStart = world.frame;
  world.onSound = (id, rate, volume) => {
    if (audioEnabled && audio) audio.playSfx(id, rate, volume);
  };
  if (route === 'stage') {
    world.score = score;
    world.lives = lives;
    world.pickupLevel = guns.spread;
    world.setWeapon(guns.type, guns.level);
    world.onRespawn = () => {
      const child = game.contentWindow;
      if (typeof child.spawnPlayer === 'function') child.spawnPlayer();
    };
    game.contentWindow.document.getElementById('cv')?.focus();
  }
}

function syncMusic(world) {
  if (!audio || !audioEnabled) return;
  if (route === 'scores') {
    if (!audio.current) audio.playMusic('level');
    return;
  }
  const wanted = route === 'stage' && !world.stageComplete
    ? (world.bossSpawned && world.bossAlive ? 'boss' : 'level') : null;
  if (wanted) audio.playMusic(wanted);
  else if (audio.current) audio.stopMusic();
}

function tick() {
  if (routeLoading) return;
  const world = game.contentWindow?.engineWorld;
  if (!world) return;
  if (world !== boundWorld) bindWorld(world);
  syncMusic(world);
  const elapsed = world.frame - routeStart;
  if (route === 'intro' && elapsed >= 220) loadRoute('title');
  else if (route === 'title' && elapsed >= 250) loadRoute('stage', 1);
  else if (route === 'stage') {
    score = world.score;
    lives = world.lives;
    guns = {
      spread: world.pickupLevel || 0,
      type: world.weaponIndex,
      level: world.weaponLevel,
    };
    if (world.gameOver) showScores();
    else if (world.stageComplete) {
      if (stage < 5) loadRoute('stage', stage + 1);
      else loadRoute('outro');
    }
  } else if (route === 'outro' && elapsed >= 500) showScores();
}

function readScores() {
  try {
    const saved = JSON.parse(localStorage.getItem('saint-dragon-high-scores'));
    if (Array.isArray(saved)) return saved;
  } catch (error) {}
  return [
    { name:'ACE', score:5000 }, { name:'STJ', score:3500 },
    { name:'DRG', score:2000 }, { name:'JAL', score:1000 }, { name:'YOU', score:500 },
  ];
}

function showScores() {
  if (route === 'scores') return;
  clearTouchInput();
  touchControls.classList.remove('active');
  route = 'scores';
  if (audioEnabled && audio && !audio.current) audio.playMusic('level');
  let table = readScores();
  if (!scoreRecorded && score > 0) {
    table.push({ name:'YOU', score });
    table.sort((a, b) => b.score - a.score);
    table = table.slice(0, 5);
    localStorage.setItem('saint-dragon-high-scores', JSON.stringify(table));
    scoreRecorded = true;
  }
  document.getElementById('score-list').innerHTML = table.map((entry, index) =>
    `<div class="score-row"><span>${index + 1}</span><span class="${entry.name === 'YOU' ? 'you' : ''}">${entry.name}</span><span class="points">${String(entry.score).padStart(6, '0')}</span></div>`
  ).join('');
  scoresScreen.hidden = false;
  scoreDeadline = performance.now() + 8000;
  status.textContent = 'HIGH SCORES';
}

function beginRun() {
  score = 0; lives = 5; stage = 1; scoreRecorded = false;
  guns = { spread:0, type:1, level:0 };
  scoresScreen.hidden = true;
  startScreen.hidden = true;
  loadRoute('intro');
}

document.getElementById('start').onclick = async () => {
  await startAudio();
  beginRun();
};
document.getElementById('again').onclick = beginRun;
document.getElementById('audio').onclick = async event => {
  audioEnabled = !audioEnabled;
  event.currentTarget.textContent = audioEnabled ? 'AUDIO: ON' : 'AUDIO: OFF';
  event.currentTarget.title = audioEnabled ? 'Turn game audio off' : 'Turn game audio on';
  if (!audioEnabled) {
    if (audio?.current) audio.stopMusic();
    if (audioContext) await audioContext.suspend();
  } else {
    await startAudio();
    if (boundWorld) syncMusic(boundWorld);
  }
};
document.getElementById('cheat').onclick = () => {
  const world = game.contentWindow?.engineWorld;
  if (!world || route !== 'stage') return;
  world.setGodMode(true);
  world.pickupLevel = 4;
  world.setWeapon(3, 2);
  status.textContent = `STAGE ${stage} · CHEAT`;
  game.contentWindow.document.getElementById('cv')?.focus();
};
document.getElementById('crt').onchange = event => frame.classList.toggle('crt', event.currentTarget.checked);
{
  const hdBox = document.getElementById('hd');
  hdBox.checked = edition === 'hd';
  hdBox.onchange = event => {
    edition = event.currentTarget.checked ? 'hd' : 'original';
    localStorage.setItem('saint-dragon-edition', edition);
    if (route !== 'idle') loadRoute(route, stage);   // reload the current screen with the new art
  };
}
function fullscreenElement() {
  return document.fullscreenElement || document.webkitFullscreenElement;
}
function updateFullscreenButton() {
  const active = !!fullscreenElement();
  fullscreen.textContent = active ? 'EXIT' : 'FULL';
  fullscreen.title = active ? 'Exit fullscreen' : 'Enter fullscreen';
  fullscreen.setAttribute('aria-label', fullscreen.title);
}
fullscreen.hidden = !(document.documentElement.requestFullscreen ||
                      document.documentElement.webkitRequestFullscreen);
fullscreen.onclick = async () => {
  try {
    if (fullscreenElement()) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) await exit.call(document);
    } else {
      const enter = document.documentElement.requestFullscreen ||
                    document.documentElement.webkitRequestFullscreen;
      if (enter) await enter.call(document.documentElement);
    }
  } catch (error) {
    fullscreen.hidden = true;
  }
};
document.addEventListener('fullscreenchange', updateFullscreenButton);
document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
game.addEventListener('load', () => {
  boundWorld = null;
  routeLoading = false;
});
for (const type of ['keydown', 'keyup']) {
  addEventListener(type, event => {
    const setGameKey = game.contentWindow?.setGameKey;
    if (typeof setGameKey !== 'function' || !setGameKey(event.code, type === 'keydown')) return;
    event.preventDefault();
  });
}

const touchDirections = new Set();
function setTouchKey(code, pressed) {
  const setGameKey = game.contentWindow?.setGameKey;
  if (typeof setGameKey === 'function') setGameKey(code, pressed);
}
function updateTouchDirections(next) {
  for (const code of touchDirections)
    if (!next.has(code)) setTouchKey(code, false);
  for (const code of next)
    if (!touchDirections.has(code)) setTouchKey(code, true);
  touchDirections.clear();
  for (const code of next) touchDirections.add(code);
}
function clearTouchInput() {
  updateTouchDirections(new Set());
  setTouchKey('Space', false);
  touchFire.classList.remove('pressed');
  touchKnob.style.transform = 'translate(-50%,-50%)';
}
function moveTouchStick(event) {
  const bounds = touchStick.getBoundingClientRect();
  const radius = bounds.width / 2;
  let x = event.clientX - bounds.left - radius;
  let y = event.clientY - bounds.top - radius;
  const length = Math.hypot(x, y);
  const limit = radius * .54;
  if (length > limit) { x *= limit / length; y *= limit / length; }
  touchKnob.style.transform = `translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`;
  const dead = radius * .18;
  const next = new Set();
  if (x < -dead) next.add('ArrowLeft');
  if (x > dead) next.add('ArrowRight');
  if (y < -dead) next.add('ArrowUp');
  if (y > dead) next.add('ArrowDown');
  updateTouchDirections(next);
}
touchStick.addEventListener('pointerdown', event => {
  touchStick.setPointerCapture(event.pointerId);
  moveTouchStick(event);
  event.preventDefault();
});
touchStick.addEventListener('pointermove', event => {
  if (touchStick.hasPointerCapture(event.pointerId)) moveTouchStick(event);
});
for (const type of ['pointerup', 'pointercancel', 'lostpointercapture'])
  touchStick.addEventListener(type, () => {
    updateTouchDirections(new Set());
    touchKnob.style.transform = 'translate(-50%,-50%)';
  });
touchFire.addEventListener('pointerdown', event => {
  touchFire.setPointerCapture(event.pointerId);
  touchFire.classList.add('pressed');
  setTouchKey('Space', true);
  event.preventDefault();
});
for (const type of ['pointerup', 'pointercancel', 'lostpointercapture'])
  touchFire.addEventListener(type, () => {
    touchFire.classList.remove('pressed');
    setTouchKey('Space', false);
  });
addEventListener('blur', clearTouchInput);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) clearTouchInput();
});
setInterval(tick, 100);
setInterval(() => {
  if (route !== 'scores') return;
  const frames = Math.max(0, Math.ceil((scoreDeadline - performance.now()) / 20));
  document.getElementById('score-prompt').textContent = String(frames).padStart(3, '0');
  if (!frames) document.getElementById('score-prompt').textContent = 'PRESS PLAY AGAIN';
}, 100);
</script>
