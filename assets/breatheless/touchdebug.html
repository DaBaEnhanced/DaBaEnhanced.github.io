<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Breathless touch diagnostics</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #090a0d; color: #cfccc4; overflow: hidden;
    font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  main { height: 100%; display: grid; grid-template-rows: auto auto 1fr; }
  header { padding: 8px 10px; padding-top: calc(8px + env(safe-area-inset-top, 0px));
           background: #111317; border-bottom: 1px solid #343840; }
  h1 { margin: 0 0 4px; font-size: 14px; color: #c8a24a; letter-spacing: .1em; }
  #verdict { padding: 8px 10px; background: #16181d; border-bottom: 1px solid #343840;
             white-space: pre-wrap; }
  #nuke { margin-top: 6px; width: 100%; padding: 10px; background: #2a1e1e;
          color: #ff9a8b; border: 1px solid #6a3b34; border-radius: 4px;
          font: inherit; }
  .bad  { color: #ff7a6b; font-weight: 700; }
  .good { color: #7ddc86; }
  .warn { color: #e8c46a; }
  #pad { position: relative; background: #000; touch-action: none; overflow: hidden; }
  #pad::after {
    content: ''; position: absolute; left: 50%; top: 0; bottom: 0;
    border-left: 1px dashed #333;
  }
  #hint { position: absolute; inset: 0; display: grid; place-items: center;
          color: #55606e; text-align: center; padding: 0 20px; pointer-events: none; }
  #log { position: absolute; inset: 0; overflow-y: auto; padding: 6px 8px;
         font-size: 11px; white-space: pre; pointer-events: none; }
  .row { color: #8f9aa8; }
  .row b { color: #cfccc4; font-weight: 400; }
  .froze { color: #ff7a6b; }
</style>
</head>
<body>
<main>
  <header>
    <h1>TOUCH DIAGNOSTICS</h1>
    <div id="env">reading environment…</div>
    <button id="nuke">clear caches + service workers, then reload</button>
  </header>
  <div id="verdict">Drag a finger below — left half, then right half.</div>
  <div id="pad">
    <div id="hint">drag here<br>left half = move stick · right half = look stick</div>
    <div id="log"></div>
  </div>
</main>

<script type="module">
// A page whose only job is to answer: what does this phone actually do?
//
// Two rounds of reasoning about mobile input have now failed to fix the sticks,
// so this stops reasoning. It reports the raw facts from the device: which
// module version is live, whether pointer lock is engaging, and -- the thing no
// harness can synthesise -- whether clientX/clientY actually CHANGE as a finger
// moves. Everything below is measured on the device and printed.

const envEl = document.getElementById('env');
const verdict = document.getElementById('verdict');
const pad = document.getElementById('pad');
const log = document.getElementById('log');
const hint = document.getElementById('hint');

// ---- 1. which build is live ------------------------------------------------
// The fix added `shouldGrabPointer` to touch.js. If it is missing, the deployed
// bundle predates it and nothing else here matters.
let mod = null, modErr = null;
try { mod = await import('./src/touch.js'); }
catch (e) { modErr = e; }

const hasFix = !!mod?.shouldGrabPointer;
const lines = [];
lines.push(`touch.js       ${modErr ? 'FAILED: ' + modErr.message
  : (hasFix ? 'has shouldGrabPointer' : 'MISSING shouldGrabPointer')}`);
lines.push(`coarse pointer ${matchMedia('(pointer: coarse)').matches}`);
lines.push(`maxTouchPoints ${navigator.maxTouchPoints}`);
lines.push(`pointerLock    ${'pointerLockElement' in document
  ? 'API present' : 'API absent'}`);
lines.push(`requestLock    ${typeof pad.requestPointerLock === 'function'
  ? 'supported on elements' : 'not supported'}`);
lines.push(`UA             ${navigator.userAgent.slice(0, 60)}`);
envEl.textContent = lines.join('\n');

if (!hasFix && !modErr) {
  verdict.innerHTML = '<span class="bad">The deployed touch.js is OLD.</span>\n' +
    'It has no shouldGrabPointer. Redeploy web/ and hard-reload before testing.';
}

// ---- 1b. the real Touch class, not a hand-rolled imitation -----------------
//
// The first version of this page watched raw pointer events on this div and
// pronounced everything healthy while the game stayed broken -- because the
// game does not use raw events on a div, it uses the Touch class on a canvas.
// Measuring a lookalike is not measuring the thing. So drive the real class.
let live = null;
try {
  live = new mod.Touch(pad, { addMouse() {} }, {});
  lines.push(`Touch.enabled  ${live.enabled}` +
    (live.enabled ? '' : '  <-- NO STICKS EXIST ON THIS DEVICE'));
} catch (e) {
  lines.push(`Touch          could not construct: ${e.message}`);
}
envEl.textContent = lines.join('\n');

// ---- 1c. is the browser running the build that is deployed? ---------------
//
// The failure that cost the most time was not in any of the game code. A fix
// was deployed, the phone kept the old behaviour, and the module that mattered
// -- main.js -- was still being served from cache. Force-reloading touch.js
// fixed that ONE file and left its importer stale, which is indistinguishable
// from "the fix does not work".
//
// So: fetch each module twice. Once bypassing the cache entirely, to see what
// the server has; once normally, to see what the browser would actually run.
// If those differ, the deployment is fine and the cache is the problem.
// Which build, exactly.
//
// The first version of this looked for identifiers -- does main.js contain the
// word `touchdebug` -- which answers "is it newer than the deploy that added
// that word", not "is it current". Every deploy since has contained it, so the
// check reported NEW on a file that could be days old and read as reassurance.
// A marker is a proxy; the build id is the thing itself.
// Three layers, measured separately.
//
// There are three places a file can be stale and they need different fixes, so
// asking "is it new?" once is not enough. The trick is that a query string
// changes Cloudflare's cache KEY, so a cache-busted URL skips the edge as well
// as the browser -- which is how a check that appended `?cb=` came to report
// the code as current while every real visitor was served something older.
// That check was reading the ORIGIN and calling it the server.
//
//   origin   ?cb=<unique>  + no-store   past the browser AND past the edge
//   edge     canonical URL + no-store   past the browser, served by the edge
//   browser  canonical URL, as normal   whatever is on this machine
//
// The layer where the id stops matching is the layer to fix.
const buildOf = (src) => src.match(/^const BUILD = '([^']*)';/m)?.[1] ?? '(none)';
const grab = async (url, init) => {
  const r = await fetch(url, init);
  return { text: await r.text(), cc: r.headers.get('cache-control') };
};

let served = '(no version.json)';
try {
  served = JSON.parse((await grab(`version.json?cb=${Date.now()}`,
                                  { cache: 'no-store' })).text).build;
} catch { /* not stamped, or offline */ }
lines.push(`origin build   ${served}`);

let layer = null;                       // where it first goes wrong
for (const file of ['src/main.js', 'src/touch.js']) {
  let origin, edge, browser;
  try {
    origin = await grab(`./${file}?cb=${Date.now()}`, { cache: 'no-store' });
    edge = await grab(`./${file}`, { cache: 'no-store' });
    browser = await grab(`./${file}`);
  } catch (e) {
    lines.push(`${file.padEnd(12)} could not fetch: ${e.message}`);
    continue;
  }
  const id = (g) => {
    const b = buildOf(g.text);
    return b === '(none)' ? `${g.text.length}B` : b;
  };
  lines.push(`${file.padEnd(12)} origin ${id(origin)}`);
  lines.push(`${''.padEnd(12)} edge   ${id(edge)}` +
             (edge.text.length === origin.text.length ? '' : '  <-- STALE'));
  lines.push(`${''.padEnd(12)} browser ${id(browser)}` +
             (browser.text.length === origin.text.length ? '' : '  <-- STALE'));
  if (!layer && edge.text.length !== origin.text.length) layer = 'edge';
  else if (!layer && browser.text.length !== origin.text.length) layer = 'browser';
  // The header the server actually sends, which is the only way to tell from a
  // phone whether _headers landed in the directory Pages publishes.
  if (file === 'src/main.js') {
    lines.push(`cache-control  ${edge.cc ?? '(none sent)'}`);
    if (!edge.cc || !/no-cache|no-store|max-age=0/.test(edge.cc)) {
      // On R2 this header is per-object metadata written at upload time, not a
      // config file: `_headers` is a Cloudflare PAGES feature and is inert
      // here, uploaded and ignored like any other object.
      lines.push('               ^ this file will be cached and can go stale.');
      lines.push('                 Re-upload with Cache-Control: no-cache');
      lines.push('                 (node tools/deploy.mjs), or add a Cache Rule.');
    }
  }
}

if (layer === 'edge') {
  verdict.innerHTML = '<span class="bad">Cloudflare\u2019s edge is serving an ' +
    'old copy.</span>\nThe origin has the current build; the edge does not, and ' +
    'a cache-busted\nURL skips the edge, which is why other checks looked fine. ' +
    'Nothing you\ndo in the browser will help.\n\nFix: Caching \u2192 Purge ' +
    'Everything in the Cloudflare dashboard.';
} else if (layer === 'browser') {
  verdict.innerHTML = '<span class="bad">This browser has an old copy.</span>\n' +
    'The edge is serving the current build, so it is local: open a private tab,\n' +
    'or clear site data for this origin.';
} else if (served !== '(no version.json)') {
  verdict.innerHTML = `<span class="good">Running build ${served}.</span>\n` +
    'Origin, edge and browser all agree. Anything still wrong is a real bug,\n' +
    'not a stale file.';
}

lines.push('');
lines.push('If main.js says OLD in either column, nothing else on this page');
lines.push('matters: the game is not running the code being debugged.');
envEl.textContent = lines.join('\n');

document.getElementById('nuke').addEventListener('click', async () => {
  const done = [];
  try {
    for (const r of await navigator.serviceWorker?.getRegistrations?.() ?? []) {
      await r.unregister(); done.push('unregistered a service worker');
    }
  } catch (e) { done.push('service workers: ' + e.message); }
  try {
    for (const k of await caches?.keys?.() ?? []) {
      await caches.delete(k); done.push(`deleted cache ${k}`);
    }
  } catch (e) { done.push('cache storage: ' + e.message); }
  // Re-request every module past the HTTP cache so the next load has fresh
  // copies to revalidate against.
  for (const f of ['src/main.js', 'src/touch.js', 'version.json']) {
    try { await fetch(`./${f}?bust=${Date.now()}`, { cache: 'reload' }); } catch {}
  }
  verdict.textContent = (done.length ? done.join('\n') : 'nothing to clear') +
    '\n\nreloading…';
  setTimeout(() => location.reload(true), 900);
});

if (live && !live.enabled) {
  verdict.innerHTML = '<span class="bad">Touch disabled itself on this device.</span>\n' +
    "matchMedia('(pointer: coarse)') is false here, so Touch binds no listeners\n" +
    'at all and no thumbstick exists. Fire would still work in the game, because\n' +
    'that comes from a different handler -- which is exactly how this hides.';
}

// ---- 2. what the device reports as a finger moves --------------------------
const seen = new Map();          // pointerId -> {x0,y0,x,y,moves,frozen,side}
let frozenAny = false, lockedEver = false, everMoved = false;
const cap = 40;
const rows = [];

const put = (cls, text) => {
  rows.push(`<div class="row ${cls}">${text}</div>`);
  if (rows.length > cap) rows.shift();
  log.innerHTML = rows.join('');
  log.scrollTop = log.scrollHeight;
};

const side = (e) => {
  const r = pad.getBoundingClientRect();
  return (e.clientX - r.left) < r.width / 2 ? 'MOVE' : 'LOOK';
};

pad.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  hint.style.display = 'none';
  seen.set(e.pointerId, { x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY,
                          moves: 0, distinct: 0, side: side(e) });
  put('', `<b>DOWN</b> id=${e.pointerId} ${e.pointerType} ${side(e)} ` +
          `@${e.clientX|0},${e.clientY|0}`);
}, { passive: false });

pad.addEventListener('pointermove', (e) => {
  e.preventDefault();
  const s = seen.get(e.pointerId);
  if (!s) return;
  s.moves++;
  const moved = (e.clientX !== s.x || e.clientY !== s.y);
  if (moved) { s.distinct++; everMoved = true; }
  s.x = e.clientX; s.y = e.clientY;
  // Report every 4th move so the log stays readable on a small screen.
  if (s.moves % 4 === 1) {
    put(moved ? '' : 'froze',
      `move  id=${e.pointerId} ${s.side} @${e.clientX|0},${e.clientY|0} ` +
      `d=${(e.clientX - s.x0)|0},${(e.clientY - s.y0)|0} ` +
      `${moved ? '' : 'COORDS DID NOT CHANGE'}`);
  }
  // The signature of the pointer-lock freeze: many events, no distinct
  // coordinates. movementX is still live under lock, so show both.
  if (s.moves >= 6 && s.distinct === 0) {
    frozenAny = true;
    say(`<span class="bad">clientX/clientY are FROZEN.</span>\n` +
        `${s.moves} pointermove events on ${s.side}, none with new coordinates.\n` +
        `movementX/Y still reports ${e.movementX|0},${e.movementY|0}.\n` +
        `pointerLockElement = ${document.pointerLockElement ? 'SET' : 'null'}\n` +
        `That is pointer lock. The sticks read clientX/clientY, so they die.`);
  }
}, { passive: false });

const end = (e) => {
  const s = seen.get(e.pointerId);
  if (!s) return;
  seen.delete(e.pointerId);
  put('', `<b>${e.type === 'pointercancel' ? 'CANCEL' : 'UP'}</b> ` +
          `id=${e.pointerId} ${s.side} moves=${s.moves} withNewCoords=${s.distinct}`);
  if (e.type === 'pointercancel') {
    say('<span class="warn">The browser CANCELLED the pointer.</span>\n' +
        'Something is stealing the gesture — a scroll, a pull-to-refresh, or a\n' +
        'parent element without touch-action:none. The stick would go dead here.');
  }
};
pad.addEventListener('pointerup', end, { passive: false });
pad.addEventListener('pointercancel', end, { passive: false });

function say(html) { verdict.innerHTML = html; }

// ---- 3. a running verdict --------------------------------------------------
setInterval(() => {
  if (document.pointerLockElement) lockedEver = true;
  if (frozenAny || !hasFix) return;              // a firm verdict already stands
  if (lockedEver) {
    say('<span class="bad">Pointer lock ENGAGED on this page.</span>\n' +
        'Nothing here asks for it, so something else did. On the game page this\n' +
        'is what freezes the sticks.');
  } else if (everMoved) {
    const d = live?.enabled ? live.direction() : null;
    say('<span class="good">Coordinates are updating normally.</span>\n' +
        `Touch.direction() = ${d === null ? 'n/a (disabled)' : d}` +
        ' — non-zero while a finger is held on the LEFT half means the\n' +
        'stick itself is working.\n' +
        'Pointer lock is not engaging and the events carry live positions, so\n' +
        'the sticks have everything they need. If the game is still stuck, the\n' +
        'fault is downstream of the events — screenshot the log and send it.');
  }
}, 250);
</script>
</body>
</html>
